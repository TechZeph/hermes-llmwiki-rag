name: ci

on:
  push:
    branches: [main, "v1-*", "release/*"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"
      - name: Lint and type-check
        run: |
          ruff check llmwiki hermes_plugin tests
          ruff format --check llmwiki hermes_plugin tests
          mypy llmwiki hermes_plugin
      - name: Tests (no network: FastEmbed is never loaded by the suite)
        run: pytest -q -p no:cacheprovider

  package:
    name: build and verify wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Wheel ships the plugin manifest and gate
        run: |
          python - <<'EOF'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert "hermes_plugin/plugin.yaml" in names, names
          assert "hermes_plugin/injection_gate.json" in names, names
          print("ok", wheel)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  hermes-doctor:
    name: hermes plugins doctor (${{ matrix.hermes_ref }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Lower and upper bounds of the declared compatibility range. Update
        # hermes_plugin/plugin.yaml when this list changes.
        hermes_ref: ["v2026.6.19", "main"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install this package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp]"
      - name: Fetch Hermes Agent
        run: |
          git clone --depth 1 --branch "${{ matrix.hermes_ref }}" https://github.com/NousResearch/hermes-agent hermes-agent
          python -m pip install -e ./hermes-agent
      - name: Doctor (registration under a sandboxed HERMES_HOME, network blocked)
        run: |
          cd hermes-agent
          python - <<'EOF'
          from hermes_cli.plugin_dev import doctor_plugin
          report = doctor_plugin("../hermes_plugin")
          print(report.format_text())
          raise SystemExit(0 if report.ok else 1)
          EOF
