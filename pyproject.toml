[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmwiki-rag"
version = "0.1.0"
description = "Local-first hybrid RAG over an Obsidian vault, as a standalone plugin for Nous Hermes Agent."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Zeph", email = "hello@techzeph.co.uk" }]
keywords = ["rag", "obsidian", "vault", "hermes", "local-first", "sqlite", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "python-frontmatter>=1.1",
    "markdown-it-py>=3.0",
    "watchdog>=4.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "fastembed>=0.4",
    "sqlite-vec>=0.1",
    "numpy>=1.26",
    "packaging>=23",
    "psutil>=5.9",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = [
    "mcp>=2,<3",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[project.entry-points."hermes_agent.plugins"]
llmwiki = "hermes_plugin"

[project.urls]
Homepage = "https://github.com/TechZeph/llmwiki-rag"
Documentation = "https://github.com/TechZeph/llmwiki-rag/blob/main/docs/README.md"
Changelog = "https://github.com/TechZeph/llmwiki-rag/blob/main/CHANGELOG.md"
Issues = "https://github.com/TechZeph/llmwiki-rag/issues"
Source = "https://github.com/TechZeph/llmwiki-rag"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmwiki*", "hermes_plugin*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
llmwiki = ["py.typed"]
hermes_plugin = ["plugin.yaml", "injection_gate.json", "skills/*/SKILL.md"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function-call-in-default-arg (common in Pydantic/FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # asserts are fine in tests

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"  # numpy stubs need 3.12 syntax; runtime floor is 3.11
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
ignore_missing_imports = true  # third-party libs without stubs

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: marks tests that touch the filesystem or a real vault",
    "eval: marks tests that are part of the evaluation harness",
]
