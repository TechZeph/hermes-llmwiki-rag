[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-llmwiki-rag"
version = "0.1.0"
description = "Local-first hybrid RAG over an Obsidian vault, as a standalone plugin for Nous Hermes Agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "Zeph", email = "hello@techzeph.co.uk" }]
keywords = ["rag", "obsidian", "vault", "hermes", "local-first", "sqlite", "vector-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "python-frontmatter>=1.1",
    "markdown-it-py>=3.0",
    "watchdog>=4.0",
    "click>=8.1",
    "pyyaml>=6.0",
    # Phase 3 onwards (deferred to keep Phase 0/1 light):
    # "fastembed>=0.4",
    # "sqlite-vec>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
embed = [
    # "fastembed>=0.4",  # Phase 3
]
vector = [
    # "sqlite-vec>=0.1",  # Phase 3
]

[project.scripts]
llmwiki = "llmwiki.cli:main"

[project.urls]
Homepage = "https://github.com/TechZeph/hermes-llmwiki-rag"
Issues = "https://github.com/TechZeph/hermes-llmwiki-rag/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["llmwiki*", "hermes_plugin*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
llmwiki = ["py.typed"]

# --- Ruff -------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # function-call-in-default-arg (common in Pydantic/FastAPI)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]  # asserts are fine in tests

# --- mypy -------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
ignore_missing_imports = true  # third-party libs without stubs

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: marks tests that touch the filesystem or a real vault",
    "eval: marks tests that are part of the evaluation harness",
]
